name: secure_vpn
version: 1.0.0+1
publish_to: none
description: Secure VPN App with 33 Global Servers

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  openvpn_flutter: ^1.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  get: ^4.6.6
  shimmer: ^3.0.0
  connectivity_plus: ^5.0.2
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/flags/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D1B1E"
  adaptive_icon_foreground: "assets/icon.png"
